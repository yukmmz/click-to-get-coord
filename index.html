<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Click to Get Coord</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="Click points on a video or image and get real-world coordinates, calibrated from two reference points. No upload, no server.">
<!-- Link previews (LINE / Slack / X). og:image must be an absolute URL. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Click to Get Coord">
<meta property="og:description" content="Click points on a video or image and get real-world coordinates, calibrated from two reference points. No upload, no server.">
<meta property="og:url" content="https://yukmmz.github.io/click-to-get-coord/">
<meta property="og:image" content="https://yukmmz.github.io/click-to-get-coord/icon-192.png">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- UI text: the Japanese in the markup is only the pre-script default. The real strings
     live in STRINGS (app.js) and are filled in by i18n.js through the data-i18n* attributes. -->
<header id="toolbar">
  <div class="group app-brand">
    <h1 class="app-title">Click to Get Coord</h1>
    <span id="app-version" class="app-version"></span>
  </div>

  <div class="group">
    <button id="btn-open" title="Ctrl+O" data-i18n="tb.open">開く</button>
    <button id="btn-load-session" disabled data-i18n="tb.resume" data-i18n-title="tb.resumeTitle"
      title="前回の保存フォルダにある session.json を読み込み、キャリブレーションとクリック点を復元して続きから作業します">作業を再開</button>
    <button id="btn-save" disabled title="Ctrl+S" data-i18n="tb.save">保存</button>
  </div>

  <div class="group" id="fps-group" hidden>
    <label for="fps-input">fps</label>
    <input type="number" id="fps-input" min="1" max="1000" step="0.001">
    <span id="fps-source" class="hint"></span>
  </div>

  <div class="group modes">
    <span class="label" data-i18n="tb.mode">モード</span>
    <button id="btn-calib" class="mode" data-mode="calib" disabled title="c">Calibration (c)</button>
    <button id="btn-add" class="mode" data-mode="add" disabled title="a">Add (a)</button>
    <button id="btn-del" class="mode" data-mode="del" disabled title="d">Delete (d)</button>
  </div>

  <div class="group">
    <label for="marker-size" data-i18n="tb.diameter" data-i18n-title="tb.diameterTitle"
      title="点の直径（画面上のピクセル）。[ で細く、] で太く">点の直径</label>
    <input type="number" id="marker-size" min="1" max="40" step="1" data-i18n-title="tb.diameterKeys" title="[ で細く、] で太く">
  </div>

  <div class="group right">
    <!-- Label and icon follow the state in syncFullscreenBtn(): corners out = expand, corners in = shrink -->
    <button id="fullscreen-btn" class="btn btn-icon" type="button" title="全画面表示" aria-label="全画面表示">
      <svg class="fs-icon fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      <svg class="fs-icon fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5"/></svg>
    </button>
    <!-- FB: opens #feedbackOverlay; sendFeedback() posts to the shared feedback endpoint -->
    <button id="feedback-btn" class="btn btn-icon" type="button"
            data-i18n-title="c.feedback" data-i18n-aria-label="c.feedback" title="フィードバックを送る" aria-label="フィードバックを送る"><span class="fb-mark" aria-hidden="true">FB</span></button>
    <button id="help-btn" class="btn btn-icon" type="button"
            data-i18n-title="c.help" data-i18n-aria-label="c.help" title="使い方" aria-label="使い方">?</button>
    <button id="settings-btn" class="btn btn-icon" type="button" aria-expanded="false"
            data-i18n-title="c.settings" data-i18n-aria-label="c.settings" title="設定" aria-label="設定">⚙</button>
  </div>
</header>

<!-- 次にやることを常に表示する案内バー -->
<div id="guide">
  <span id="guide-step">STEP 1</span>
  <span id="guide-text">動画または画像ファイルを開いてください</span>
  <span id="guide-sub"></span>
</div>

<nav id="navbar">
  <button id="btn-prev" disabled data-i18n-aria-label="nav.prev" data-i18n-title="nav.prev" aria-label="前のフレーム（← / z）" title="前のフレーム（← / z）">◀</button>
  <span id="frame-label">- / -</span>
  <button id="btn-next" disabled data-i18n-aria-label="nav.next" data-i18n-title="nav.next" aria-label="次のフレーム（→ / x）" title="次のフレーム（→ / x）">▶</button>
  <label for="frame-step" class="label" data-i18n="nav.step" data-i18n-title="nav.stepTitle"
    title="◀ ▶ 1回で進むフレーム数。, で減らし . で増やす">送り幅</label>
  <input type="number" id="frame-step" min="1" max="10000" step="1" value="1" disabled
    data-i18n-title="nav.stepKeys" title=", で減らし . で増やす">
  <button id="btn-jump" disabled title="j" data-i18n="nav.jump">ジャンプ (j)</button>
  <span id="frame-time" class="hint"></span>

  <span class="sep"></span>

  <span class="label" data-i18n="nav.view">表示</span>
  <button id="btn-zoom-out" disabled data-i18n-title="nav.zoomOut" data-i18n-aria-label="nav.zoomOut" title="縮小（- キー）" aria-label="縮小（- キー）">－</button>
  <span id="zoom-label">100%</span>
  <button id="btn-zoom-in" disabled data-i18n-title="nav.zoomIn" data-i18n-aria-label="nav.zoomIn" title="拡大（+ キー）" aria-label="拡大（+ キー）">＋</button>
  <button id="btn-zoom-reset" disabled data-i18n="nav.fit" data-i18n-title="nav.fitTitle" title="全体表示に戻す（0 キー）">全体</button>
  <span class="hint" data-i18n="nav.gestures">ピンチ/Ctrl+ホイール=拡大縮小、2本指スクロール=移動</span>

  <span class="spacer"></span>
  <span id="point-count" class="hint"></span>
</nav>

<div id="seek-row" hidden>
  <input type="range" id="seek" min="0" max="0" value="0" step="1"
    data-i18n-title="nav.seekTitle" title="ドラッグまたはクリックで任意のフレームへ移動">
</div>

<main id="stage">
  <canvas id="canvas"></canvas>
  <p id="placeholder" data-i18n="placeholder">動画または画像ファイルを開いてください（ドラッグ＆ドロップも可）</p>
</main>

<section id="logbox">
  <div id="log"></div>
</section>

<footer id="status">ready</footer>

<!-- キャリブレーション点の実世界座標入力 -->
<dialog id="dlg-calib">
  <form method="dialog">
    <h2 id="calib-title">キャリブレーション 1点目の実世界座標</h2>
    <p class="hint" id="calib-pixel"></p>
    <p class="lead" data-i18n-html="calib.lead">この点の<b>実際の座標</b>を入力してください。単位は任意（mm でも m でも図面上の値でも可）。</p>
    <div class="fields">
      <label>x <input type="number" id="calib-x" step="any" required autofocus></label>
      <label>y <input type="number" id="calib-y" step="any" required></label>
    </div>
    <p class="hint" id="calib-note"></p>
    <menu>
      <button type="button" id="calib-cancel" data-i18n="dlg.cancel">キャンセル</button>
      <button type="submit" value="ok" class="primary" data-i18n="dlg.okEnter">OK（Enter）</button>
    </menu>
  </form>
</dialog>

<!-- フレームジャンプ -->
<dialog id="dlg-jump">
  <form method="dialog">
    <h2 data-i18n="jump.title">フレームへ移動</h2>
    <div class="fields">
      <label><span data-i18n="jump.label">フレーム番号</span> <input type="number" id="jump-value" min="1" step="1" required autofocus></label>
    </div>
    <p class="hint" id="jump-range"></p>
    <menu>
      <button type="button" id="jump-cancel" data-i18n="dlg.cancel">キャンセル</button>
      <button type="submit" value="ok" class="primary" data-i18n="jump.go">移動（Enter）</button>
    </menu>
  </form>
</dialog>

<!-- 確認 / メッセージ -->
<dialog id="dlg-confirm">
  <form method="dialog">
    <h2 id="confirm-title">確認</h2>
    <p class="lead" id="confirm-text"></p>
    <menu>
      <button type="button" id="confirm-cancel">キャンセル</button>
      <button type="submit" value="ok" class="primary" id="confirm-ok">OK</button>
    </menu>
  </form>
</dialog>

<!-- Settings sheet. The common rows (language, share, changelog, other apps) are the same
     in every yukmmz.github.io app; this app's own settings sit between them. Every control
     applies the moment it changes: there is no OK / Cancel. -->
<div id="sheet-backdrop" class="backdrop" hidden></div>

<section id="settings-panel" class="sheet" hidden data-i18n-aria-label="c.settings" aria-label="設定">
  <div class="sheet-head">
    <h2 class="sheet-title" data-i18n="c.settings">設定</h2>
    <button id="settings-close" class="btn btn-icon" type="button"
            data-i18n-aria-label="c.close" data-i18n-title="c.close" aria-label="閉じる" title="閉じる">✕</button>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.language">言語</span>
    <select id="lang-select" class="sheet-select" data-i18n-aria-label="c.language" aria-label="言語">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </div>

  <label class="sheet-row">
    <span class="sheet-label" data-i18n="set.diameter">点の直径（px）</span>
    <input type="number" id="set-diameter" min="1" max="40" step="1">
  </label>
  <label class="sheet-row">
    <span class="sheet-label" data-i18n="set.pointColor">クリック点の色</span>
    <input type="color" id="set-point-color">
  </label>
  <label class="sheet-row">
    <span class="sheet-label" data-i18n="set.calibColor">キャリブレーション点の色</span>
    <input type="color" id="set-calib-color">
  </label>
  <label class="sheet-row">
    <span class="sheet-label"><span data-i18n="set.framePngs">フレームごとの PNG</span>
      <small data-i18n="set.framePngsNote">plot / overlay を書き出す。画像は既定でオン、動画は枚数が膨らむため既定でオフ</small></span>
    <input type="checkbox" id="set-frame-pngs">
  </label>
  <label class="sheet-row">
    <span class="sheet-label" data-i18n="set.indexAuto">点の番号を点と同じ色にする</span>
    <input type="checkbox" id="set-index-auto">
  </label>
  <label class="sheet-row">
    <span class="sheet-label"><span data-i18n="set.indexColor">点の番号の色</span>
      <small data-i18n="set.indexColorNote">上のチェックを外したとき</small></span>
    <input type="color" id="set-index-color">
  </label>
  <label class="sheet-row">
    <span class="sheet-label"><span data-i18n="set.markerEdge">点に白い縁取りをつける</span>
      <small data-i18n="set.markerEdgeNote">太さは点の大きさに連動</small></span>
    <input type="checkbox" id="set-marker-edge">
  </label>
  <label class="sheet-row">
    <span class="sheet-label" data-i18n="set.smooth">プロットの線を滑らかな曲線にする</span>
    <input type="checkbox" id="set-smooth">
  </label>
  <label class="sheet-row">
    <span class="sheet-label" data-i18n="set.showIndex">点の番号を表示する</span>
    <input type="checkbox" id="set-show-index">
  </label>
  <label class="sheet-row">
    <span class="sheet-label"><span data-i18n="set.equalAspect">プロットの縦横比を 1:1 に固定する</span>
      <small data-i18n="set.equalAspectNote">長さの計測など、x と y が同じ量のとき</small></span>
    <input type="checkbox" id="set-equal-aspect">
  </label>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.share">共有</span>
    <button id="qrBtn" class="btn" type="button" data-i18n="c.showQr">QR コードを表示</button>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.changelog">更新履歴</span>
    <button id="changelogBtn" class="btn" type="button" data-i18n="c.showChangelog">表示</button>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.otherApps">他のアプリ</span>
    <a id="otherAppsLink" class="btn" href="https://yukmmz.github.io/" target="_blank" rel="noopener"
       data-i18n="c.openPortal">アプリ一覧を開く</a>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.data">データ</span>
    <button id="clearDataBtn" class="btn btn-danger" type="button" data-i18n="c.clearData">保存データを消す</button>
  </div>
</section>

<!-- QR オーバーレイ: アプリURL（左）とソースリポジトリURL（右） -->
<div id="qrOverlay" hidden>
  <div class="qrcard">
    <div class="qrrow">
      <div class="qrcol">
        <div class="qrlabel">App</div>
        <img class="qrImg" src="qr.svg" alt="QR code for the app URL">
        <div class="qrurl" id="qrUrl"></div>
      </div>
      <div class="qrcol">
        <div class="qrlabel">Source</div>
        <img class="qrImg" src="src-qr.svg" alt="QR code for the source repository">
        <div class="qrurl" id="qrSrcUrl"></div>
      </div>
    </div>
    <button id="qrClose" class="btn" type="button" data-i18n="c.close">閉じる</button>
  </div>
</div>

<!-- 更新履歴: 新しい順。中身は app.js の CHANGELOG から組み立てる -->
<div id="changelogOverlay" hidden>
  <div class="qrcard changelog-card" role="dialog" data-i18n-aria-label="c.changelog" aria-label="更新履歴">
    <h2 class="changelog-title" data-i18n="c.changelog">更新履歴</h2>
    <div id="changelogList" class="changelog-list"></div>
    <button id="changelogClose" class="btn" type="button" data-i18n="c.close">閉じる</button>
  </div>
</div>

<!-- 使い方: header ? button, or the ? / h keys. Same look and closing as the changelog.
     The body is filled from STRINGS['help.body']. -->
<div id="helpOverlay" hidden>
  <div class="qrcard changelog-card help-card" role="dialog" data-i18n-aria-label="c.help" aria-label="使い方">
    <h2 class="changelog-title" data-i18n="c.help">使い方</h2>
    <div class="changelog-list help-body" data-i18n-html="help.body"></div>
    <button id="helpClose" class="btn" type="button" data-i18n="c.close">閉じる</button>
  </div>
</div>

<!-- Feedback: the header FB button opens this; sendFeedback() posts to the shared GAS web app -->
<div id="feedbackOverlay" hidden>
  <form id="feedbackForm" class="qrcard changelog-card feedback-card" role="dialog"
        data-i18n-aria-label="c.feedback" aria-label="フィードバックを送る" novalidate>
    <h2 class="changelog-title" data-i18n="c.feedback">フィードバックを送る</h2>
    <p class="feedback-lead" data-i18n="c.feedbackLead"></p>
    <textarea id="feedbackMessage" class="feedback-message" maxlength="2000" rows="6" required
              data-i18n-placeholder="c.feedbackPlaceholder" data-i18n-aria-label="c.feedbackMessage"></textarea>
    <input id="feedbackContact" class="feedback-contact" type="text" maxlength="200" autocomplete="email"
           data-i18n-placeholder="c.feedbackContact" data-i18n-aria-label="c.feedbackContact">
    <!-- honeypot: invisible to people, bots fill it in and are ignored by the server -->
    <input id="feedbackWebsite" class="feedback-hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="feedback-note" data-i18n="c.feedbackNote"></p>
    <p id="feedbackStatus" class="feedback-status" role="status" aria-live="polite"></p>
    <div class="feedback-actions">
      <button id="feedbackClose" class="btn" type="button" data-i18n="c.close">閉じる</button>
      <button id="feedbackSend" class="btn btn-primary" type="submit" data-i18n="c.feedbackSend">送信</button>
    </div>
  </form>
</div>

<input type="file" id="file-input" accept="video/*,image/*" multiple hidden>
<input type="file" id="session-input" accept="application/json,.json" hidden>

<script src="i18n.js"></script>
<script src="calib.js"></script>
<script src="points.js"></script>
<script src="matwriter.js"></script>
<script src="exporters.js"></script>
<script src="plot.js"></script>
<script src="source.js"></script>
<script src="app.js"></script>
</body>
</html>
